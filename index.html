<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Songearch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e8e8ea;
      min-height: 100vh;
      padding: 48px 20px;
    }

    main { max-width: 1000px; margin: 0 auto; }

    h1 {
      font-size: 2.4rem;
      background: linear-gradient(90deg, #7c5cff, #2ee6a6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      width: fit-content;
    }

    .subtitulo { color: #9a9aa5; margin: 8px 0 28px; }

    form { display: flex; gap: 10px; }

    input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #2a2d38;
      background: #171a21;
      color: inherit;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid #7c5cff; border-color: transparent; }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6a49f0; }
    button:disabled { opacity: 0.5; cursor: wait; }

    #status { margin-top: 20px; color: #9a9aa5; min-height: 24px; }
    #interpretacao { margin-top: 6px; color: #2ee6a6; font-size: 0.95rem; }

    #resultados {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .card {
      background: #171a21;
      border: 1px solid #23262f;
      border-radius: 12px;
      padding: 12px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #7c5cff; }

    .area-midia {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #23262f;
    }
    .area-midia img, .area-midia iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }

    .nome {
      margin-top: 10px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artista { color: #9a9aa5; font-size: 0.9rem; margin-top: 2px; }

    .acoes { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .btn-ouvir { padding: 8px 14px; font-size: 0.85rem; }
    .link-spotify { color: #2ee6a6; font-size: 0.85rem; text-decoration: none; }
    .link-spotify:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Songearch</h1>
    <p class="subtitulo">Descreva o clima e descubra músicas que combinam.</p>

    <form id="form-busca">
      <input id="descricao" type="text" autocomplete="off"
             placeholder="Ex: música calma pra estudar à noite, com piano">
      <button id="botao" type="submit">Buscar</button>
    </form>

    <p id="status"></p>
    <p id="interpretacao"></p>
    <section id="resultados"></section>
  </main>

  <script>
    const form = document.getElementById("form-busca");
    const campo = document.getElementById("descricao");
    const botao = document.getElementById("botao");
    const statusEl = document.getElementById("status");
    const interpretacaoEl = document.getElementById("interpretacao");
    const listaEl = document.getElementById("resultados");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const descricao = campo.value.trim();
      if (!descricao) return;

      botao.disabled = true;
      statusEl.textContent = "Buscando as músicas ideais... (pode levar alguns segundos)";
      interpretacaoEl.textContent = "";
      listaEl.innerHTML = "";

      try {
        const resposta = await fetch("/buscar?descricao=" + encodeURIComponent(descricao));
        if (!resposta.ok) throw new Error("erro " + resposta.status);

        const dados = await resposta.json();
        mostrarInterpretacao(dados.interpretacao);
        mostrarResultados(dados.resultados);
      } catch (erro) {
        statusEl.textContent = "Algo deu errado (" + erro.message + "). Tente de novo em instantes.";
      } finally {
        botao.disabled = false;
      }
    });

    function mostrarInterpretacao(info) {
      const partes = [];
      if (info.mood) partes.push("Clima: " + info.mood);
      if (info.generos && info.generos.length) partes.push("Gêneros: " + info.generos.join(", "));
      if (info.instrumentos && info.instrumentos.length) partes.push("Instrumentos: " + info.instrumentos.join(", "));
      interpretacaoEl.textContent = partes.join("  ·  ");
    }

    function mostrarResultados(musicas) {
      if (!musicas.length) {
        statusEl.textContent = "Não encontrei músicas para essa descrição. Tente descrever de outro jeito.";
        return;
      }
      statusEl.textContent = musicas.length + " músicas encontradas";

      for (const musica of musicas) {
        const card = document.createElement("div");
        card.className = "card";

        const areaMidia = document.createElement("div");
        areaMidia.className = "area-midia";
        if (musica.capa) {
          const capa = document.createElement("img");
          capa.src = musica.capa;
          capa.alt = "Capa de " + musica.album;
          capa.loading = "lazy";
          areaMidia.appendChild(capa);
        }

        const nome = document.createElement("div");
        nome.className = "nome";
        nome.textContent = musica.nome;

        const artista = document.createElement("div");
        artista.className = "artista";
        artista.textContent = musica.artista;

        const acoes = document.createElement("div");
        acoes.className = "acoes";

        const btnOuvir = document.createElement("button");
        btnOuvir.className = "btn-ouvir";
        btnOuvir.type = "button";
        btnOuvir.textContent = "▶ Ouvir";
        btnOuvir.addEventListener("click", () => ouvir(musica, areaMidia, btnOuvir));

        const linkSpotify = document.createElement("a");
        linkSpotify.className = "link-spotify";
        linkSpotify.href = musica.spotify_url;
        linkSpotify.target = "_blank";
        linkSpotify.rel = "noopener";
        linkSpotify.textContent = "Abrir no Spotify";

        acoes.append(btnOuvir, linkSpotify);
        card.append(areaMidia, nome, artista, acoes);
        listaEl.appendChild(card);
      }
    }

    async function ouvir(musica, areaMidia, btnOuvir) {
      btnOuvir.disabled = true;
      btnOuvir.textContent = "Carregando...";

      try {
        const url = "/video?artista=" + encodeURIComponent(musica.artista) +
                    "&musica=" + encodeURIComponent(musica.nome);
        const resposta = await fetch(url);

        if (resposta.status === 503) throw new Error("O limite diário de vídeos foi atingido. Tente novamente amanhã.");
        if (resposta.status === 404) throw new Error("Não encontrei um vídeo para essa faixa.");
        if (!resposta.ok) throw new Error("Erro ao buscar o vídeo.");

        const dados = await resposta.json();

        const player = document.createElement("iframe");
        player.src = "https://www.youtube-nocookie.com/embed/" + dados.video_id + "?autoplay=1";
        player.allow = "autoplay; encrypted-media";
        player.allowFullscreen = true;
        player.referrerPolicy = "strict-origin-when-cross-origin";

        areaMidia.replaceChildren(player);
        btnOuvir.remove();
      } catch (erro) {
        btnOuvir.disabled = false;
        btnOuvir.textContent = "▶ Ouvir";
        statusEl.textContent = erro.message;
      }
    }
  </script>
</body>
</html>
